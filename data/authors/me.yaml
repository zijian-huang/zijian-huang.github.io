bio: |
  I am currently working as a post-doc in Sun Yat-sen University in Guangzhou, China.
  My research integrates terrestrial laser scanning (TLS), three-dimensional canopy architecture,
  and plant functional traits to understand how structural complexity influences
  carbon storage and ecological strategies in mangrove forests.
  I am particularly interested in linking individual tree architecture, community structure,
  and ecosystem functioning across environmental gradients.

