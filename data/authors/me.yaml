bio: |
  Why do trees build different canopy architectures, and how do these structures shape their ecological performance?

  I am a forest and community ecologist at Sun Yat-sen University.
  My research investigates the links between plant functional strategies, three-dimensional tree architecture,
  and ecosystem carbon dynamics, with a focus on coastal mangroves.
  Combining field ecology, terrestrial LiDAR, hyperspectral modelling, and data analyses,
  I seek to understand how variation in plant structure and functional scales from individual trees to forest ecosystems.

